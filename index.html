<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click Counter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 20px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 480px;
  }
  h1 {
    color: #94a3b8;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0 0 4px;
    text-align: center;
  }
  .subtitle {
    color: #475569;
    font-size: 12px;
    margin-bottom: 28px;
    text-align: center;
  }

  .dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; }
  .dot {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #64748b;
    background: #1f2937; border: 2px solid #334155;
  }
  .dot.active { border-color: #4ade80; color: #4ade80; }
  .dot.done { background: #14532d; border-color: #4ade80; color: #bbf7d0; }

  .counter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 10px 0 4px;
  }
  .stepper {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    font-size: 30px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .stepper:active { transform: scale(0.92); }
  .stepper.plus { background: #22c55e; color: #052e12; }
  .stepper.plus:hover { background: #16a34a; }
  .stepper.minus { background: #1f2937; color: #f87171; border: 1px solid #334155; }
  .stepper.minus:hover { background: #334155; }
  .stepper:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #count {
    font-size: 72px;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
    line-height: 1;
    min-width: 110px;
    transition: transform 0.12s ease;
  }
  #count.bump-up { transform: scale(1.1); color: #4ade80; }
  #count.bump-down { transform: scale(1.1); color: #f87171; }

  .meta {
    color: #64748b;
    font-size: 13px;
    margin: 20px 0 20px;
    min-height: 18px;
  }
  .meta b { color: #cbd5e1; }

  .save-indicator {
    color: #4ade80;
    font-size: 11px;
    opacity: 0;
    transition: opacity 0.3s ease;
    margin-bottom: 6px;
    min-height: 14px;
  }
  .save-indicator.show { opacity: 1; }

  button.primary {
    display: block;
    width: 100%;
    margin: 0 auto;
    background: #22c55e;
    color: #052e12;
    border: none;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.primary:hover { background: #16a34a; }
  button.primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

  .btn-row { margin-top: 14px; display: flex; gap: 10px; justify-content: center; }
  button.secondary {
    background: transparent;
    color: #64748b;
    border: 1px solid #334155;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button.secondary:hover { color: #e2e8f0; border-color: #475569; }
  button.secondary.danger:hover { color: #fca5a5; border-color: #7f1d1d; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 14px;
  }
  th, td {
    padding: 10px 8px;
    text-align: left;
    border-bottom: 1px solid #1f2937;
    color: #cbd5e1;
  }
  th { color: #64748b; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  tfoot td {
    font-weight: 800;
    color: #4ade80;
    font-size: 18px;
    border-bottom: none;
    border-top: 2px solid #334155;
    padding-top: 14px;
  }

  @media (max-width: 340px) {
    .card { padding: 28px 20px; }
    h1 { font-size: 13px; letter-spacing: 1.5px; }
    .subtitle { font-size: 11px; margin-bottom: 20px; }
    .dots { gap: 6px; margin-bottom: 18px; }
    .dot { width: 28px; height: 28px; font-size: 11px; }
    .counter-row { flex-wrap: wrap; gap: 12px; }
    #count { order: -1; width: 100%; font-size: 56px; min-width: 80px; margin-bottom: 4px; }
    .stepper.minus { order: 1; }
    .stepper.plus { order: 2; }
    .stepper { width: 46px; height: 46px; font-size: 24px; }
    table, th, td { font-size: 12px; }
    button.primary {
      width: auto;
      min-width: unset;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 10px;
      font-weight: 600;
    }
    .detail-text { display: none; }
    #summaryView table,
    #completedTable { display: none !important; }
  }

  /* EOD Summary popup */
  .eod-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .eod-modal {
    position: relative;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 18px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  .eod-heading {
    color: #4ade80;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 22px;
  }
  .eod-text {
    text-align: left;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    margin: 8px 0 20px;
  }
  .eod-copy-btn {
    width: 100%;
  }
  .eod-close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    color: #64748b;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  .eod-close:hover { color: #e2e8f0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Click Counter</h1>
    <div class="subtitle" id="saveIndicator">Progress saved automatically</div>

    <div class="dots" id="dots">
      <div class="dot" data-n="1">1</div>
      <div class="dot" data-n="2">2</div>
      <div class="dot" data-n="3">EOD</div>
    </div>

    <!-- Live tracking view -->
    <div id="liveView">
      <div class="counter-row">
        <button class="stepper minus" id="minusBtn">−</button>
        <p id="count">0</p>
        <button class="stepper plus" id="plusBtn">+</button>
      </div>
      <div class="meta" id="meta"><span class="detail-text"></span></div>
      <button class="primary" id="actionBtn">End<span class="detail-text"> Interval 1</span></button>
      <div class="btn-row">
        <button class="secondary danger" id="resetBtn">Reset Shift</button>
      </div>

      <!-- Completed intervals so far, stays visible while working on the current one -->
      <table id="completedTable" style="display:none; margin-top:26px;">
        <thead>
          <tr><th>Interval</th><th>Start</th><th>End</th><th>Count</th></tr>
        </thead>
        <tbody id="completedBody"></tbody>
        <tfoot>
          <tr><td colspan="3">Partial Total</td><td id="partialTotal">0</td></tr>
        </tfoot>
      </table>
    </div>

    <!-- Final summary view -->
    <div id="summaryView" style="display:none;">
      <div class="meta" id="shiftRange" style="margin-bottom:16px;"></div>
      <table>
        <thead>
          <tr><th>Interval</th><th>Start</th><th>End</th><th>Count</th></tr>
        </thead>
        <tbody id="summaryBody"></tbody>
        <tfoot>
          <tr><td colspan="3">Total Task Finished</td><td id="grandTotal">0</td></tr>
        </tfoot>
      </table>
      <div class="btn-row" style="margin-top:20px; flex-direction:column; gap:10px;">
        <button class="secondary" id="eodSummaryBtn">EOD Summary</button>
        <button class="secondary danger" id="newShiftBtn">Start New Shift</button>
      </div>
    </div>
  </div>

  <!-- EOD Summary popup -->
  <div id="eodOverlay" class="eod-overlay" style="display:none;">
    <div class="eod-modal">
      <button class="eod-close" id="eodCloseBtn">&times;</button>
      <pre id="eodText" class="eod-text"></pre>
      <button class="secondary eod-copy-btn" id="eodCopyBtn">Copy</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = "shift-state-manual";

  const countEl = document.getElementById("count");
  const metaEl = document.getElementById("meta");
  const actionBtn = document.getElementById("actionBtn");
  const plusBtn = document.getElementById("plusBtn");
  const minusBtn = document.getElementById("minusBtn");
  const liveView = document.getElementById("liveView");
  const summaryView = document.getElementById("summaryView");
  const summaryBody = document.getElementById("summaryBody");
  const grandTotalEl = document.getElementById("grandTotal");
  const dots = document.querySelectorAll(".dot");
  const completedTable = document.getElementById("completedTable");
  const completedBody = document.getElementById("completedBody");
  const partialTotalEl = document.getElementById("partialTotal");
  const shiftRangeEl = document.getElementById("shiftRange");
  const eodOverlay = document.getElementById("eodOverlay");
  const eodTextEl = document.getElementById("eodText");
  const eodCopyBtn = document.getElementById("eodCopyBtn");
  const saveIndicator = document.getElementById("saveIndicator");

  let state = {
    phase: "notStarted", // notStarted -> running -> (repeat per interval) -> done
    currentInterval: 1,
    liveCount: 0,
    startTime: null,
    intervals: []
  };

  let stateLoaded = false; // guard so we don't overwrite saved data before it's loaded

  function fmtTime(iso) {
    if (!iso) return "--";
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function flashSaveIndicator(text) {
    saveIndicator.textContent = text;
    saveIndicator.classList.add("show");
    clearTimeout(flashSaveIndicator._t);
    flashSaveIndicator._t = setTimeout(() => {
      saveIndicator.classList.remove("show");
    }, 1200);
  }

  async function saveState() {
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      if (result) {
        flashSaveIndicator("Saved");
      } else {
        flashSaveIndicator("Save failed — check connection");
      }
    } catch (e) {
      console.warn("Could not save shift state:", e);
      flashSaveIndicator("Save failed — check connection");
    }
  }

  async function loadState() {
    try {
      const result = await window.storage.get(STORAGE_KEY, false);
      if (result && result.value) {
        state = JSON.parse(result.value);
      }
    } catch (e) {
      // No saved state yet — use defaults
    } finally {
      stateLoaded = true;
    }
  }

  function updateDots() {
    dots.forEach(dot => {
      const n = parseInt(dot.dataset.n, 10);
      dot.classList.remove("active", "done");
      if (state.intervals.find(iv => iv.number === n)) {
        dot.classList.add("done");
      } else if (n === state.currentInterval && state.phase === "running") {
        dot.classList.add("active");
      }
    });
  }

  function renderCompletedTable() {
    const showTable = state.intervals.length > 0 || state.phase === "running";
    if (!showTable) {
      completedTable.style.display = "none";
      return;
    }
    completedBody.innerHTML = "";
    let partial = 0;
    state.intervals.forEach(iv => {
      partial += iv.count;
      const row = document.createElement("tr");
      row.innerHTML = `<td>Interval ${iv.number}</td><td>${fmtTime(iv.startTime)}</td><td>${fmtTime(iv.endTime)}</td><td>${iv.count}</td>`;
      completedBody.appendChild(row);
    });
    if (state.phase === "running") {
      partial += state.liveCount; // include the interval currently in progress
    }
    partialTotalEl.textContent = partial;
    completedTable.style.display = "table";
  }

  function renderSummary() {
    summaryBody.innerHTML = "";
    let total = 0;
    state.intervals.forEach(iv => {
      total += iv.count;
      const row = document.createElement("tr");
      row.innerHTML = `<td>Interval ${iv.number}</td><td>${fmtTime(iv.startTime)}</td><td>${fmtTime(iv.endTime)}</td><td>${iv.count}</td>`;
      summaryBody.appendChild(row);
    });
    grandTotalEl.textContent = total;

    const shiftStart = state.intervals[0]?.startTime;
    const shiftEnd = state.intervals[state.intervals.length - 1]?.endTime;
    shiftRangeEl.innerHTML = `Shift Start: <b>${fmtTime(shiftStart)}</b> &nbsp;·&nbsp; Shift End: <b>${fmtTime(shiftEnd)}</b>`;

    liveView.style.display = "none";
    summaryView.style.display = "block";
  }

  function renderLive() {
    liveView.style.display = "block";
    summaryView.style.display = "none";
    renderCompletedTable();

    // Most recently completed interval, if any — used for the "notStarted" hint text.

    if (state.phase === "notStarted") {
      countEl.textContent = "0";
      const startHint = `<span class="detail-text"> </span>`;
      metaEl.innerHTML = prev
        ? `Interval ${prev.number} ended at <b>${fmtTime(prev.endTime)}</b> <span class="detail-text">· Tap + to start Interval ${state.currentInterval}</span>`
        : startHint;
      actionBtn.innerHTML = state.currentInterval >= 3
        ? `End<span class="detail-text"> of Shift</span>`
        : `End<span class="detail-text"> Interval ${state.currentInterval}</span>`;
      actionBtn.disabled = true;
      plusBtn.disabled = false;
      minusBtn.disabled = true;
    } else if (state.phase === "running") {
      countEl.textContent = state.liveCount;
      actionBtn.innerHTML = state.currentInterval >= 3
        ? `End<span class="detail-text"> of Shift</span>`
        : `End<span class="detail-text"> Interval ${state.currentInterval}</span>`;
      actionBtn.disabled = false;
      plusBtn.disabled = false;
      minusBtn.disabled = false;
    }
    updateDots();
  }

  function render() {
    if (state.phase === "done") {
      renderSummary();
    } else {
      renderLive();
    }
  }

  function bump(direction) {
    countEl.classList.remove("bump-up", "bump-down");
    void countEl.offsetWidth;
    countEl.classList.add(direction === "up" ? "bump-up" : "bump-down");
    setTimeout(() => countEl.classList.remove("bump-up", "bump-down"), 120);
  }

  async function increment() {
    if (state.phase === "notStarted") {
      // First tap of + starts this interval (and the shift, if this is Interval 1)
      state.phase = "running";
      state.startTime = new Date().toISOString();
    }
    state.liveCount += 1;
    render();
    bump("up");
    await saveState();
  }

  async function decrement() {
    if (state.phase !== "running") return;
    if (state.liveCount <= 0) return;
    state.liveCount -= 1;
    render();
    bump("down");
    await saveState();
  }

  async function handleActionClick() {
    if (state.phase !== "running") return; // nothing to end yet

    // End the current interval
    state.intervals.push({
      number: state.currentInterval,
      startTime: state.startTime,
      endTime: new Date().toISOString(),
      count: state.liveCount
    });

    if (state.currentInterval >= 3) {
      state.phase = "done"; // End of Shift
    } else {
      state.currentInterval += 1;
      state.phase = "notStarted";
    }
    state.liveCount = 0;
    state.startTime = null;
    await saveState();
    render();
  }

  async function resetShift() {
    if (!confirm("Reset the current shift? This clears all recorded intervals.")) return;
    state = { phase: "notStarted", currentInterval: 1, liveCount: 0, startTime: null, intervals: [] };
    await saveState();
    render();
  }

  function fmtDate(iso) {
    const d = iso ? new Date(iso) : new Date();
    return d.toLocaleDateString(); 
  }

  function openEodSummary() {
    const shiftStart = state.intervals[0]?.startTime;
    const shiftEnd = state.intervals[state.intervals.length - 1]?.endTime;
    const total = state.intervals.reduce((sum, iv) => sum + iv.count, 0);

    const text = [
      "EOD OOS CWH POD 0",
      fmtDate(shiftStart),
      `Time Started : 11:30 AM`,
      `Time Finished : 5:30 PM`,
      `Tasks Done/Finished: ${total}`
    ].join("\n");

    eodTextEl.textContent = text;
    eodCopyBtn.textContent = "Copy";
    eodOverlay.style.display = "flex";
  }

  function closeEodSummary() {
    eodOverlay.style.display = "none";
  }

  async function copyEodText() {
    const text = eodTextEl.textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // Fallback for environments where the Clipboard API is blocked
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try {
        document.execCommand("copy");
      } catch (err) {
        console.warn("Copy failed:", err);
      }
      document.body.removeChild(temp);
    }
    eodCopyBtn.textContent = "Copied!";
    setTimeout(() => { eodCopyBtn.textContent = "Copy"; }, 1500);
  }

  document.getElementById("eodSummaryBtn").addEventListener("click", openEodSummary);
  document.getElementById("eodCloseBtn").addEventListener("click", closeEodSummary);
  eodCopyBtn.addEventListener("click", copyEodText);
  eodOverlay.addEventListener("click", (e) => {
    if (e.target === eodOverlay) closeEodSummary();
  });

  plusBtn.addEventListener("click", increment);
  minusBtn.addEventListener("click", decrement);
  actionBtn.addEventListener("click", handleActionClick);
  document.getElementById("resetBtn").addEventListener("click", resetShift);
  document.getElementById("newShiftBtn").addEventListener("click", resetShift);

  (async function init() {
    saveIndicator.textContent = "Loading your saved progress...";
    await loadState();
    render();
    saveIndicator.textContent = "Progress saved automatically";
  })();

</script>
</body>
</html>
