<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click Counter</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #111827;
    --card-border: #1f2937;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, var(--bg));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 480px;
  }
  h1 {
    color: #94a3b8;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0 0 4px;
    text-align: center;
  }
  .subtitle {
    color: #475569;
    font-size: 12px;
    margin-bottom: 16px;
    text-align: center;
  }

  .pod-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .pod-row label {
    color: #64748b;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  #podSelect {
    background: #1f2937;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    text-align: center;
    text-align-last: center;
  }
  #podSelect:hover { border-color: #4ade80; }
  #podSelect:focus { outline: none; border-color: #4ade80; }

  .type-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    background: #1f2937;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .type-btn {
    position: relative;
    flex: 1 1 0;
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }
  .type-btn.active { background: #22c55e; color: #052e12; }
  .type-btn:not(.active):hover { color: #e2e8f0; }
  .type-btn .badge {
    position: absolute;
    top: 4px;
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ade80;
  }
  .type-btn.active .badge { background: #052e12; }
  .type-label-short { display: none; }
  .type-label-full { display: inline; }

  .dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; }
  .dot {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #64748b;
    background: #1f2937; border: 2px solid #334155;
  }
  .dot.active { border-color: #4ade80; color: #4ade80; }
  .dot.done { background: #14532d; border-color: #4ade80; color: #bbf7d0; }

  .counter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 10px 0 4px;
  }
  .stepper {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    font-size: 30px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .stepper:active { transform: scale(0.92); }
  .stepper.plus { background: #22c55e; color: #052e12; }
  .stepper.plus:hover { background: #16a34a; }
  .stepper.minus { background: #1f2937; color: #f87171; border: 1px solid #334155; }
  .stepper.minus:hover { background: #334155; }
  .stepper:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #count {
    font-size: 72px;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
    line-height: 1;
    min-width: 110px;
    transition: transform 0.12s ease;
  }
  #count.bump-up { transform: scale(1.1); color: #4ade80; }
  #count.bump-down { transform: scale(1.1); color: #f87171; }

  .meta {
    color: #64748b;
    font-size: 13px;
    margin: 20px 0 20px;
    min-height: 18px;
  }
  .meta b { color: #cbd5e1; }

  .save-indicator {
    color: #4ade80;
    font-size: 11px;
    opacity: 0;
    transition: opacity 0.3s ease;
    margin-bottom: 6px;
    min-height: 14px;
  }
  .save-indicator.show { opacity: 1; }

  button.primary {
    display: block;
    width: 100%;
    margin: 0 auto;
    background: #22c55e;
    color: #052e12;
    border: none;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.primary:hover { background: #16a34a; }
  button.primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

  .btn-row { margin-top: 14px; display: flex; gap: 10px; justify-content: center; }
  button.secondary {
    background: transparent;
    color: #64748b;
    border: 1px solid #334155;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button.secondary:hover { color: #e2e8f0; border-color: #475569; }
  button.secondary.danger:hover { color: #fca5a5; border-color: #7f1d1d; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 14px;
  }
  th, td {
    padding: 10px 8px;
    text-align: left;
    border-bottom: 1px solid #1f2937;
    color: #cbd5e1;
  }
  th { color: #64748b; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  tfoot td {
    font-weight: 800;
    color: #4ade80;
    font-size: 18px;
    border-bottom: none;
    border-top: 2px solid #334155;
    padding-top: 14px;
  }

  .type-total-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #94a3b8;
    background: #1f2937;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 14px;
  }
  .type-total-row b { color: #e2e8f0; }
  #otherTypeRow, #otherTypeRowDone {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }

  @media (max-width: 340px) {
    .card { padding: 28px 20px; }
    h1 { font-size: 13px; letter-spacing: 1.5px; }
    .subtitle { font-size: 11px; margin-bottom: 14px; }
    .pod-row { margin-bottom: 14px; }
    .type-row { margin-bottom: 18px; }
    .type-btn { font-size: 12px; padding: 8px 6px; }
    .type-btn[data-type="box"] { flex: 1 1 100%; margin-top: 4px; }
    .type-label-full { display: none; }
    .type-label-short { display: inline; }
    .dots { gap: 6px; margin-bottom: 18px; }
    .dot { width: 28px; height: 28px; font-size: 11px; }
    .counter-row { flex-wrap: wrap; gap: 12px; }
    #count { order: -1; width: 100%; font-size: 56px; min-width: 80px; margin-bottom: 4px; }
    .stepper.minus { order: 1; }
    .stepper.plus { order: 2; }
    .stepper { width: 46px; height: 46px; font-size: 24px; }
    table, th, td { font-size: 12px; }
    button.primary {
      width: auto;
      min-width: unset;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 10px;
      font-weight: 600;
    }
    .detail-text { display: none; }
    #summaryView table,
    #completedTable { display: none !important; }
  }

  .eod-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .eod-modal {
    position: relative;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 18px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  .eod-text {
    text-align: left;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    margin: 8px 0 20px;
  }
  .eod-copy-btn { width: 100%; }
  .eod-close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    color: #64748b;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  .eod-close:hover { color: #e2e8f0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Click Counter</h1>
    <div class="subtitle" id="saveIndicator">Progress saved automatically</div>

    <div class="pod-row">
      <label for="podSelect">Pod</label>
      <select id="podSelect">
        <option value="0">0</option>
        <option value="1">1</option>
      </select>
    </div>

    <div class="type-row" id="typeRow">
      <button class="type-btn" data-type="confirmation" type="button"><span class="type-label-full">Confirmation</span><span class="type-label-short">Confirm</span><span class="badge" style="display:none;"></span></button>
      <button class="type-btn" data-type="coverage" type="button"><span class="type-label-full">Coverage</span><span class="type-label-short">Cover</span><span class="badge" style="display:none;"></span></button>
      <button class="type-btn" data-type="box" type="button"><span class="type-label-full">Box</span><span class="type-label-short">Box</span><span class="badge" style="display:none;"></span></button>
    </div>

    <div class="dots" id="dots">
      <div class="dot" data-n="1">1</div>
      <div class="dot" data-n="2">2</div>
      <div class="dot" data-n="3">EOD</div>
    </div>

    <div id="liveView">
      <div class="counter-row">
        <button class="stepper minus" id="minusBtn">−</button>
        <p id="count">0</p>
        <button class="stepper plus" id="plusBtn">+</button>
      </div>
      <div class="meta" id="meta"><span class="detail-text"></span></div>
      <button class="primary" id="actionBtn">End<span class="detail-text"> Interval 1</span></button>
      <div class="btn-row">
        <button class="secondary danger" id="resetBtn">Reset Shift</button>
      </div>

      <table id="completedTable" style="display:none; margin-top:26px;">
        <thead>
          <tr><th>Interval</th><th>Start</th><th>End</th><th>Count</th></tr>
        </thead>
        <tbody id="completedBody"></tbody>
        <tfoot>
          <tr><td colspan="3">Partial Total</td><td id="partialTotal">0</td></tr>
        </tfoot>
      </table>

      <div id="otherTypeRow"></div>
    </div>

    <div id="summaryView" style="display:none;">
      <div class="meta" id="shiftRange" style="margin-bottom:16px;"></div>
      <table>
        <thead>
          <tr><th>Interval</th><th>Start</th><th>End</th><th>Count</th></tr>
        </thead>
        <tbody id="summaryBody"></tbody>
        <tfoot>
          <tr><td colspan="3" id="totalLabel">Total Finished</td><td id="grandTotal">0</td></tr>
        </tfoot>
      </table>
      <div id="otherTypeRowDone"></div>
      <div class="btn-row" style="margin-top:20px; flex-direction:column; gap:10px;">
        <button class="secondary" id="eodSummaryBtn">EOD Summary</button>
        <button class="secondary" id="editIntervalBtn">Edit EOD</button>
        <button class="secondary danger" id="newShiftBtn">Start New Shift</button>
      </div>
    </div>
  </div>

  <div id="eodOverlay" class="eod-overlay" style="display:none;">
    <div class="eod-modal">
      <button class="eod-close" id="eodCloseBtn">&times;</button>
      <pre id="eodText" class="eod-text"></pre>
      <button class="secondary eod-copy-btn" id="eodCopyBtn">Copy</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = "shift-state-manual";
  const TYPES = ["confirmation", "coverage", "box"];
  const TYPE_LABEL = { confirmation: "Confirmation", coverage: "Coverage", box: "Box" };

  const countEl = document.getElementById("count");
  const metaEl = document.getElementById("meta");
  const actionBtn = document.getElementById("actionBtn");
  const plusBtn = document.getElementById("plusBtn");
  const minusBtn = document.getElementById("minusBtn");
  const liveView = document.getElementById("liveView");
  const summaryView = document.getElementById("summaryView");
  const summaryBody = document.getElementById("summaryBody");
  const grandTotalEl = document.getElementById("grandTotal");
  const totalLabelEl = document.getElementById("totalLabel");
  const dots = document.querySelectorAll(".dot");
  const completedTable = document.getElementById("completedTable");
  const completedBody = document.getElementById("completedBody");
  const partialTotalEl = document.getElementById("partialTotal");
  const shiftRangeEl = document.getElementById("shiftRange");
  const eodOverlay = document.getElementById("eodOverlay");
  const eodTextEl = document.getElementById("eodText");
  const eodCopyBtn = document.getElementById("eodCopyBtn");
  const saveIndicator = document.getElementById("saveIndicator");
  const podSelect = document.getElementById("podSelect");
  const editIntervalBtn = document.getElementById("editIntervalBtn");
  const typeRow = document.getElementById("typeRow");
  const typeButtons = typeRow.querySelectorAll(".type-btn");
  const otherTypeRow = document.getElementById("otherTypeRow");
  const otherTypeRowDone = document.getElementById("otherTypeRowDone");

  const POD_START_TIMES = { "0": "10:00 AM", "1": "10:00 AM" };

  function freshTypeData() {
    return { liveCount: 0, startTime: null, intervals: [] };
  }

  // phase and currentInterval are SHARED across Confirmation/Coverage/Box —
  // ending an interval ends it for Confirmation and Coverage at the same time.
  // Box has no per-interval concept: it keeps accumulating across intervals
  // 1, 2 and 3, and only gets locked into a record when End of Shift is hit.
  let state = {
    pod: "0",
    activeType: "confirmation",
    phase: "notStarted",       // notStarted -> running -> ... -> done
    currentInterval: 1,
    types: { confirmation: freshTypeData(), coverage: freshTypeData(), box: freshTypeData() }
  };

  function track(type) { return state.types[type || state.activeType]; }

  function fmtTime(iso) {
    if (!iso) return "--";
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function fmtDate(iso) {
    const d = iso ? new Date(iso) : new Date();
    return d.toLocaleDateString();
  }

  function flashSaveIndicator(text) {
    saveIndicator.textContent = text;
    saveIndicator.classList.add("show");
    clearTimeout(flashSaveIndicator._t);
    flashSaveIndicator._t = setTimeout(() => saveIndicator.classList.remove("show"), 1200);
  }

  let saveTimer = null;
  let pendingSave = false;
  const SAVE_DEBOUNCE_MS = 400;

  function scheduleSave() {
    pendingSave = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, SAVE_DEBOUNCE_MS);
  }

  function flushSave() {
    clearTimeout(saveTimer);
    if (!pendingSave) return;
    pendingSave = false;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      flashSaveIndicator("Saved");
    } catch (e) {
      console.warn("Could not save state:", e);
      flashSaveIndicator("Save failed — storage may be full or blocked");
    }
  }

  async function saveState() {
    pendingSave = true;
    flushSave();
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (!parsed) return;

      if (parsed.types && parsed.types.confirmation && typeof parsed.types.confirmation.phase !== "undefined") {
        // Migrate from the version where phase/currentInterval lived per-type.
        const conf = parsed.types.confirmation;
        state = {
          pod: parsed.pod ?? "0",
          activeType: TYPES.includes(parsed.activeType) ? parsed.activeType : "confirmation",
          phase: conf.phase ?? "notStarted",
          currentInterval: conf.currentInterval ?? 1,
          types: {
            confirmation: { liveCount: conf.liveCount ?? 0, startTime: conf.startTime ?? null, intervals: conf.intervals ?? [] },
            coverage: {
              liveCount: parsed.types.coverage?.liveCount ?? 0,
              startTime: parsed.types.coverage?.startTime ?? null,
              intervals: parsed.types.coverage?.intervals ?? []
            },
            box: freshTypeData()
          }
        };
      } else if (parsed.types && parsed.types.confirmation) {
        // Already the shared-phase format.
        state = parsed;
        if (!TYPES.includes(state.activeType)) state.activeType = "confirmation";
        if (!state.types.coverage) state.types.coverage = freshTypeData();
        if (!state.types.box) state.types.box = freshTypeData();
      } else if (parsed.phase) {
        // Oldest single-track format.
        state = {
          pod: parsed.pod ?? "0",
          activeType: "confirmation",
          phase: parsed.phase,
          currentInterval: parsed.currentInterval ?? 1,
          types: {
            confirmation: { liveCount: parsed.liveCount ?? 0, startTime: parsed.startTime ?? null, intervals: parsed.intervals ?? [] },
            coverage: freshTypeData(),
            box: freshTypeData()
          }
        };
      }
    } catch (e) {
      // no saved state yet, or it was corrupted — use defaults
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && pendingSave) flushSave();
  });
  window.addEventListener("beforeunload", () => { if (pendingSave) flushSave(); });

  function updateDots() {
    dots.forEach(dot => {
      const n = parseInt(dot.dataset.n, 10);
      dot.classList.remove("active", "done");
      const doneHere = track("confirmation").intervals.find(iv => iv.number === n);
      if (doneHere) dot.classList.add("done");
      else if (n === state.currentInterval && state.phase === "running") dot.classList.add("active");
    });
  }

  function trackTotal(t) {
    let total = t.intervals.reduce((s, iv) => s + iv.count, 0);
    if (state.phase === "running") total += t.liveCount;
    return total;
  }

  function renderCompletedTable() {
    const t = track();
    if (state.activeType === "box") {
      completedTable.style.display = "none";
    } else {
      const showTable = t.intervals.length > 0 || state.phase === "running";
      if (!showTable) {
        completedTable.style.display = "none";
      } else {
        completedBody.innerHTML = "";
        t.intervals.forEach(iv => {
          const row = document.createElement("tr");
          row.innerHTML = `<td>Interval ${iv.number}</td><td>${fmtTime(iv.startTime)}</td><td>${fmtTime(iv.endTime)}</td><td>${iv.count}</td>`;
          completedBody.appendChild(row);
        });
        partialTotalEl.textContent = trackTotal(t);
        completedTable.style.display = "table";
      }
    }

    const others = TYPES.filter(ty => ty !== state.activeType);
    if (state.phase === "running") {
      otherTypeRow.style.display = "flex";
      otherTypeRow.innerHTML = others.map(ty => {
        const ot = track(ty);
        const suffix = ty === "box" ? " · whole shift" : " (this interval)";
        return `<div class="type-total-row"><span>${TYPE_LABEL[ty]}${suffix}</span><b>${ot.liveCount}</b></div>`;
      }).join("");
    } else {
      otherTypeRow.style.display = "none";
    }
  }

  function renderSummary() {
    const t = track();
    summaryBody.innerHTML = "";
    let total = 0;
    t.intervals.forEach(iv => {
      total += iv.count;
      const row = document.createElement("tr");
      row.innerHTML = `<td>Interval ${iv.number}</td><td>${fmtTime(iv.startTime)}</td><td>${fmtTime(iv.endTime)}</td><td>${iv.count}</td>`;
      summaryBody.appendChild(row);
    });
    grandTotalEl.textContent = total;
    totalLabelEl.textContent = `${TYPE_LABEL[state.activeType]} Total Finished`;

    const shiftStart = t.intervals[0]?.startTime;
    const shiftEnd = t.intervals[t.intervals.length - 1]?.endTime;
    shiftRangeEl.innerHTML = `Start: <b>${fmtTime(shiftStart)}</b> &nbsp;·&nbsp; End: <b>${fmtTime(shiftEnd)}</b>`;

    const canEdit = t.intervals.length > 0;
    editIntervalBtn.style.display = canEdit ? "block" : "none";
    const lastLabel = canEdit
      ? (t.intervals[t.intervals.length - 1].number >= 3 ? "EOD" : `Interval ${t.intervals[t.intervals.length - 1].number}`)
      : "";
    editIntervalBtn.textContent = canEdit ? `Edit ${lastLabel}` : "Edit";

    const others = TYPES.filter(ty => ty !== state.activeType);
    const rows = others.map(ty => {
      const ot = track(ty);
      const otTotal = ot.intervals.reduce((s, iv) => s + iv.count, 0);
      if (ot.intervals.length === 0) return "";
      return `<div class="type-total-row"><span>${TYPE_LABEL[ty]}</span><b>${otTotal}</b></div>`;
    }).join("");
    if (rows) {
      otherTypeRowDone.style.display = "flex";
      otherTypeRowDone.innerHTML = rows;
    } else {
      otherTypeRowDone.style.display = "none";
    }

    liveView.style.display = "none";
    summaryView.style.display = "block";
  }

  function renderLive() {
    const t = track();
    liveView.style.display = "block";
    summaryView.style.display = "none";
    renderCompletedTable();

    if (state.activeType === "box") {
      countEl.textContent = String(t.liveCount);
      metaEl.innerHTML = `<span class="detail-text">Box counts across the whole shift — locks in at End of Shift</span>`;
    } else {
      const prev = t.intervals.length > 0 ? t.intervals[t.intervals.length - 1] : null;
      countEl.textContent = String(t.liveCount);
      metaEl.innerHTML = (state.phase === "notStarted" && prev)
        ? `Interval ${prev.number} ended at <b>${fmtTime(prev.endTime)}</b> <span class="detail-text">· Tap + to start Interval ${state.currentInterval}</span>`
        : `<span class="detail-text"> </span>`;
    }

    actionBtn.innerHTML = state.currentInterval >= 3 ? `End<span class="detail-text"> of Shift</span>` : `End<span class="detail-text"> Interval ${state.currentInterval}</span>`;
    actionBtn.disabled = false;
    plusBtn.disabled = false;
    minusBtn.disabled = (state.phase === "notStarted") ? true : (t.liveCount <= 0);

    updateDots();
  }

  function renderPodSelect() { podSelect.value = String(state.pod ?? "0"); }

  function renderTypeButtons() {
    typeButtons.forEach(btn => {
      const type = btn.dataset.type;
      const isActive = type === state.activeType;
      btn.classList.toggle("active", isActive);
      const badge = btn.querySelector(".badge");
      const hasLive = state.phase === "running" && track(type).liveCount > 0;
      badge.style.display = (!isActive && hasLive) ? "block" : "none";
    });
  }

  function render() {
    renderPodSelect();
    renderTypeButtons();
    if (state.phase === "done") renderSummary();
    else renderLive();
  }

  function bump(direction) {
    countEl.classList.remove("bump-up", "bump-down");
    void countEl.offsetWidth;
    countEl.classList.add(direction === "up" ? "bump-up" : "bump-down");
    setTimeout(() => countEl.classList.remove("bump-up", "bump-down"), 120);
  }

  let audioCtx = null;
  function playClickSound(direction) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(direction === "up" ? 650 : 500, now);
      osc.frequency.exponentialRampToValueAtTime(direction === "up" ? 420 : 330, now + 0.035);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.003);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    } catch (e) {
      console.warn("Click sound unavailable:", e);
    }
  }

  async function increment() {
    if (state.phase !== "notStarted" && state.phase !== "running") return;
    if (state.phase === "notStarted") state.phase = "running";
    const t = track();
    if (!t.startTime) t.startTime = new Date().toISOString();
    t.liveCount += 1;
    playClickSound("up");
    render();
    bump("up");
    scheduleSave();
  }

  async function decrement() {
    if (state.phase !== "running") return;
    const t = track();
    if (t.liveCount <= 0) return;
    t.liveCount -= 1;
    playClickSound("down");
    render();
    bump("down");
    scheduleSave();
  }

  async function handleActionClick() {
    if (state.phase !== "running" && state.phase !== "notStarted") return;

    const isLastInterval = state.currentInterval >= 3;
    const conf = track("confirmation");
    const cov = track("coverage");
    const box = track("box");
    let confirmMsg = (isLastInterval ? `End of Shift — ` : `End Interval ${state.currentInterval} — `)
      + `Confirmation: ${conf.liveCount}, Coverage: ${cov.liveCount}`
      + (isLastInterval ? `, Box: ${box.liveCount}` : "")
      + `. This ends the interval for Confirmation and Coverage` + (isLastInterval ? ` and locks in the Box count.` : `.`);
    if (!confirm(confirmMsg)) return;

    const endTime = new Date().toISOString();
    TYPES.forEach(type => {
      // Box only records/resets once, at End of Shift — otherwise it keeps accumulating.
      if (type === "box" && !isLastInterval) return;
      const t = track(type);
      const startTime = t.startTime || endTime;
      t.intervals.push({ number: state.currentInterval, startTime, endTime, count: t.liveCount });
      t.liveCount = 0;
      t.startTime = null;
    });

    if (isLastInterval) {
      state.phase = "done";
    } else {
      state.currentInterval += 1;
      state.phase = "notStarted";
    }
    await saveState();
    render();
  }

  async function reopenLastInterval() {
    const conf = track("confirmation");
    if (conf.intervals.length === 0) return;
    const cov = track("coverage");
    const box = track("box");
    const lastConf = conf.intervals[conf.intervals.length - 1];
    const lastCov = cov.intervals[cov.intervals.length - 1];
    const wasFinal = lastConf.number >= 3;
    const lastBox = wasFinal ? box.intervals[box.intervals.length - 1] : null;

    const label = wasFinal ? "EOD" : `Interval ${lastConf.number}`;
    let msg = `Reopen ${label} for editing? Confirmation: ${lastConf.count}, Coverage: ${lastCov ? lastCov.count : 0}`
      + (wasFinal ? `, Box: ${lastBox ? lastBox.count : 0}` : "") + ".";
    if (state.phase === "done") msg += " This will undo the shift completion until you end it again.";
    if (!confirm(msg)) return;

    state.currentInterval = lastConf.number;
    conf.intervals.pop();
    conf.liveCount = lastConf.count;
    conf.startTime = lastConf.startTime;

    if (lastCov) {
      cov.intervals.pop();
      cov.liveCount = lastCov.count;
      cov.startTime = lastCov.startTime;
    }

    if (wasFinal && lastBox) {
      box.intervals.pop();
      box.liveCount = lastBox.count;
      box.startTime = lastBox.startTime;
    }
    // If this wasn't the final interval, Box wasn't touched when it ended, so leave it be.

    state.phase = "running";
    await saveState();
    render();
  }

  async function resetShift() {
    if (!confirm("Reset the current shift? This clears all recorded intervals for Confirmation, Coverage and Box.")) return;
    const keepPod = state.pod ?? "0";
    const keepType = state.activeType ?? "confirmation";
    state = {
      pod: keepPod,
      activeType: keepType,
      phase: "notStarted",
      currentInterval: 1,
      types: { confirmation: freshTypeData(), coverage: freshTypeData(), box: freshTypeData() }
    };
    await saveState();
    render();
  }

  function setActiveType(type) {
    if (!TYPES.includes(type) || type === state.activeType) return;
    state.activeType = type;
    scheduleSave();
    render();
  }

  function openEodSummary() {
    const pod = String(state.pod ?? "0");
    const timeStarted = POD_START_TIMES[pod] || POD_START_TIMES["0"];

    const confIntervals = state.types.confirmation.intervals;
    const covIntervals = state.types.coverage.intervals;
    const boxIntervals = state.types.box.intervals;
    const confTotal = confIntervals.reduce((s, iv) => s + iv.count, 0);
    const covTotal = covIntervals.reduce((s, iv) => s + iv.count, 0);
    const boxTotal = boxIntervals.reduce((s, iv) => s + iv.count, 0);
    const total = confTotal + covTotal + boxTotal;

    const allTimes = [...confIntervals, ...covIntervals, ...boxIntervals];
    const starts = allTimes.map(iv => iv.startTime).filter(Boolean).sort();
    const ends = allTimes.map(iv => iv.endTime).filter(Boolean).sort();

    const lines = [
      `EOD OOS CWH POD ${pod}`,
      fmtDate(starts[0]),
      `Time Started : ${timeStarted}`,
      `Time Finished : ${fmtTime(ends[ends.length - 1])}`,
      `Total Confirmation Task: ${confTotal}`,
      `Total Coverage Task: ${covTotal}`,
      `Total Drawn Box: ${boxTotal}`
    ];

    eodTextEl.textContent = lines.join("\n");
    eodCopyBtn.textContent = "Copy";
    eodOverlay.style.display = "flex";
  }

  function closeEodSummary() { eodOverlay.style.display = "none"; }

  async function copyEodText() {
    const text = eodTextEl.textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try { document.execCommand("copy"); } catch (err) { console.warn("Copy failed:", err); }
      document.body.removeChild(temp);
    }
    eodCopyBtn.textContent = "Copied!";
    setTimeout(() => { eodCopyBtn.textContent = "Copy"; }, 1500);
  }

  document.getElementById("eodSummaryBtn").addEventListener("click", openEodSummary);
  document.getElementById("eodCloseBtn").addEventListener("click", closeEodSummary);
  eodCopyBtn.addEventListener("click", copyEodText);
  eodOverlay.addEventListener("click", (e) => { if (e.target === eodOverlay) closeEodSummary(); });

  plusBtn.addEventListener("click", increment);
  minusBtn.addEventListener("click", decrement);
  actionBtn.addEventListener("click", handleActionClick);
  document.getElementById("resetBtn").addEventListener("click", resetShift);
  document.getElementById("newShiftBtn").addEventListener("click", resetShift);
  editIntervalBtn.addEventListener("click", reopenLastInterval);
  podSelect.addEventListener("change", () => { state.pod = podSelect.value; scheduleSave(); });
  typeButtons.forEach(btn => btn.addEventListener("click", () => setActiveType(btn.dataset.type)));

  (function init() {
    loadState();
    render();
    saveIndicator.textContent = "Progress saved automatically";
  })();
</script>
</body>
</html>
